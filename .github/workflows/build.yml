# Builds the ROMs on every push and pull request.
# Pushing a version tag (for example v1.0.0) also publishes a GitHub Release
# with the ROMs attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # libdragon commit the tester is built against (trunk, Sep 2026).
  LIBDRAGON_COMMIT: e356bf3f56f7afbf7e5246329562f145965cfdfc
  N64_INST: /opt/libdragon

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the N64 toolchain
        run: |
          wget -q https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb
          sudo dpkg -i gcc-toolchain-mips64-x86_64.deb
          sudo chown -R "$USER" "$N64_INST"

      - name: Build and install libdragon
        run: |
          git clone --filter=blob:none https://github.com/DragonMinded/libdragon.git "$RUNNER_TEMP/libdragon"
          cd "$RUNNER_TEMP/libdragon"
          git checkout "$LIBDRAGON_COMMIT"
          make -j"$(nproc)" install tools-install
          make -C boot -j"$(nproc)"

      - name: Build ROMs
        run: |
          export PATH="$N64_INST/bin:$PATH"
          make -j"$(nproc)"
          make -j"$(nproc)" DEBUG=1 LIBDRAGON_SRC="$RUNNER_TEMP/libdragon"
          make sample-report.html

      - uses: actions/upload-artifact@v4
        with:
          name: n64-pad-tester
          path: |
            n64-pad-tester.z64
            n64-pad-tester-debug.z64
            sample-report.html

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            n64-pad-tester.z64
            n64-pad-tester-debug.z64
